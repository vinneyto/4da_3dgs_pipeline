[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recon-pipeline"
version = "0.1.0"
description = "Composable dataset and 3D reconstruction pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
aws = [
  "boto3>=1.35,<2",
  "Pillow>=9",
]
rerun = [
  "numpy>=1.26,<3",
  "rerun-sdk>=0.23,<1",
]
dev = [
  "numpy>=1.26,<3",
  "Pillow>=9",
  "pytest>=8,<9",
]

[project.scripts]
recon-aws-worker = "recon_pipeline.workers.aws.cli:main"
recon-config = "recon_pipeline.workers.aws.config_cli:main"
recon-rerun = "recon_pipeline.artifacts.rerun.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
