[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recon-pipeline"
version = "0.1.0"
description = "Composable dataset and 3D reconstruction pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
aws = [
  "boto3>=1.35,<2",
  "pyTelegramBotAPI>=4.37,<5",
]
rerun = [
  "numpy>=1.26,<3",
  "rerun-sdk>=0.23,<1",
]
splatfacto-rerun = [
  "rerun-sdk>=0.36,<0.37",
  "numpy>=1.26,<3",
  "plyfile>=1.1,<2",
  "pillow>=10,<13",
  "tensorboard>=2,<3",
]
dev = [
  "numpy>=1.26,<3",
  "pytest>=8,<9",
  "pillow>=10,<13",
  "opencv-python-headless>=4.8,<5",
  "plyfile>=1.1,<2",
  "pyTelegramBotAPI>=4.37,<5",
]

[project.scripts]
recon-aws-worker = "recon_pipeline.workers.aws.cli:main"
recon-config = "recon_pipeline.workers.aws.config_cli:main"
recon-rerun = "recon_pipeline.utilities.artefacts.rerun.export:main"
recon-prepare-experiment = "recon_pipeline.utilities.datasets.fourdanyone.prepare_experiment:main"
recon-4danyone = "recon_pipeline.utilities.datasets.fourdanyone.inference:main"
recon-prepare-rgba = "recon_pipeline.utilities.reconstructions.nerfstudio.prepare_rgba:main"
recon-splat-convert = "recon_pipeline.utilities.artefacts.splats.convert:main"
recon-splatfacto = "recon_pipeline.utilities.reconstructions.nerfstudio.splatfacto:main"
recon-splatfacto-rerun = "recon_pipeline.utilities.artefacts.rerun.splatfacto:main"
recon-nerfstudio-export = "recon_pipeline.utilities.reconstructions.nerfstudio.export:main"
recon-aws-preflight = "recon_pipeline.utilities.cloud.aws.preflight:main"
recon-s3-download-input = "recon_pipeline.utilities.storage.s3.download_input:main"
recon-s3-sync-models = "recon_pipeline.utilities.storage.s3.sync_models:main"
recon-s3-restore-experiment = "recon_pipeline.utilities.storage.s3.restore_experiment:main"
recon-s3-upload-results = "recon_pipeline.utilities.storage.s3.upload_results:main"
recon-s3-publish-artifacts = "recon_pipeline.utilities.storage.s3.publish_artifacts:main"
recon-s3-recover-run = "recon_pipeline.utilities.storage.s3.recover_run:main"
recon-s3-upload-diagnostics = "recon_pipeline.utilities.storage.s3.upload_diagnostics:main"
recon-write-run-manifest = "recon_pipeline.utilities.artefacts.manifest.write:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
