[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recon-pipeline"
version = "0.1.0"
description = "Composable dataset and 3D reconstruction pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
aws = [
  "boto3>=1.35,<2",
]
rerun = [
  "numpy>=1.26,<3",
  "rerun-sdk>=0.23,<1",
]
dev = [
  "numpy>=1.26,<3",
  "pytest>=8,<9",
]

[project.scripts]
recon-aws-worker = "recon_pipeline.workers.aws.cli:main"
recon-config = "recon_pipeline.workers.aws.config_cli:main"
recon-rerun = "recon_pipeline.artifacts.rerun.utilities.export:main"
recon-prepare-experiment = "recon_pipeline.datasets.fourdanyone.utilities.prepare_experiment:main"
recon-4danyone = "recon_pipeline.datasets.fourdanyone.utilities.inference:main"
recon-nerfstudio-export = "recon_pipeline.reconstructions.nerfstudio.utilities.export:main"
recon-aws-preflight = "recon_pipeline.workers.aws.utilities.preflight:main"
recon-s3-download-input = "recon_pipeline.workers.aws.utilities.download_input:main"
recon-s3-sync-models = "recon_pipeline.workers.aws.utilities.sync_models:main"
recon-s3-restore-experiment = "recon_pipeline.workers.aws.utilities.restore_experiment:main"
recon-s3-upload-results = "recon_pipeline.workers.aws.utilities.upload_results:main"
recon-write-run-manifest = "recon_pipeline.workers.aws.utilities.write_run_manifest:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
