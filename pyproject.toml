[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fourda-3dgs-pipeline"
version = "0.1.0"
description = "4DAnyone to Nerfstudio/3DGS pipeline for AWS SageMaker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
aws = [
  "boto3>=1.35,<2",
]
rerun = [
  "rerun-sdk>=0.23,<1",
]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
fourda-aws-worker = "fourda_aws_worker.cli:main"
fourda-worker-config = "fourda_aws_worker.config_cli:main"
fourda-rerun = "fourda_rerun.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
