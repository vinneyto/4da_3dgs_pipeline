[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fourda-3dgs-pipeline"
version = "0.1.0"
description = "4DAnyone to Nerfstudio/3DGS pipeline for AWS SageMaker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
aws = [
  "boto3>=1.35,<2",
]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
fourda-pipeline = "fourda_pipeline.cli:main"
fourda-aws-job = "fourda_aws_job.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
